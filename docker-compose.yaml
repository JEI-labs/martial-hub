version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: thaiboxe-db
    environment:
      POSTGRES_USER: thaiboxe
      POSTGRES_PASSWORD: Thaiboxe@123
      POSTGRES_DB: thaiboxe-db
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Banco dos testes (`npm test`): a mesma versão do banco no ar e sem volume,
  # para cada subida começar vazia e nada de teste sobrar em disco.
  postgres-test:
    image: postgres:15
    container_name: thaiboxe-db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
